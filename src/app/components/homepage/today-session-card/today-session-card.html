<ion-card class="today-session-card">
  <div class="card-grid">
    <div class="card-text">
      <ion-card-header>
        <ion-card-title>{{ selectedDayName() }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        No workout session registered today.
      </ion-card-content>
    </div>

    <div class="card-media">
      <img src="assets/images/session-card-background.svg" alt="Session background" />
      <ion-button shape="round" class="session-button">
        <span class="button-label">Add Session</span>
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
      </ion-button>
    </div>
  </div>
</ion-card>
